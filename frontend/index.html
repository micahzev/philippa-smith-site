  <!-- ============== CLOUDFLARE WEB ANALYTICS ============== -->

  <style>
    /* =============================================================
       DESIGN TOKENS
       ============================================================= */
    :root {
      --bg: #FBFBFB;
      --bg-warm: #FBFBFB;
      --ink: #1a1a1a;
      --ink-soft: #4a4a4a;
      --ink-mute: #8a8880;
      --rule: #e6e3dc;
      --accent: #1a1a1a;

      --f-display: 'Montserrat', sans-serif;
      --f-body: 'Montserrat', sans-serif;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --dur: 1.5s;

      --page-pad: clamp(16px, 2.5vw, 32px);
      --gap: clamp(14px, 2vw, 24px);
    }

    @media (prefers-color-scheme: dark) {
      /* Keep the gallery white aesthetic in dark mode too — just slightly toned */
      /* If you'd prefer real dark mode, swap these values */
    }

    /* =============================================================
       RESET & BASE
       ============================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-body);
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
    }

    img, video { max-width: 100%; height: auto; display: block; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
    a { color: inherit; text-decoration: none; }

    /* =============================================================
       HEADER
       ============================================================= */
    header.site {
      position: relative;
      padding: clamp(36px, 7vw, 84px) var(--page-pad) clamp(28px, 5vw, 56px);
      text-align: center;
      z-index: 2;
    }

    h1.artist-name {
      font-family: var(--f-display);
      font-weight: 200;
      font-optical-sizing: auto;
      font-size: clamp(40px, 7vw, 84px);
      line-height: 1;
      letter-spacing: 0.005em;
      margin: 0;
      font-style: normal;
    }

    .tagline {
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }

    /* =============================================================
       MAIN
       ============================================================= */
    main {
      position: relative;
      z-index: 2;
      padding: 0 0 clamp(60px, 8vw, 120px);
    }

    /* =============================================================
       CAROUSEL (Project)
       ============================================================= */
    .project {
      padding: clamp(28px, 4vw, 48px) var(--page-pad);
    }
    .project:first-child { border-top: 0; }

    .project-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: clamp(20px, 3vw, 32px);
    }
    .project-title {
      font-family: var(--f-display);
      font-style: normal;
      font-optical-sizing: auto;
      font-weight: 100;
      font-size: clamp(22px, 3.2vw, 34px);
      line-height: 1.1;
      margin: 0;
      margin-left: 3rem;
      letter-spacing: 0.005em;
    }
    .counter {
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--ink-mute);
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
      margin-right: 7rem;
    }

    /* Stage: arrows flank the viewport */
    .stage {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: clamp(10px, 2vw, 24px);
    }
    /* Solo mode: single work, no navigation. Preserve the same visual width
       as multi-item carousels by keeping arrow-sized reserved columns. */
    .stage.solo {
      grid-template-columns: 48px 1fr 48px;
    }
    .stage.solo .arrow { visibility: hidden; pointer-events: none; }
    .project:has(.stage.solo) .counter { visibility: hidden; }
    @media (max-width: 767px) {
      .counter { display: none; }
    }
    .arrow {
      /* Chevron-only, no border, no background */
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      color: var(--ink);
      transition: color 180ms var(--ease), opacity 180ms var(--ease), transform 180ms var(--ease);
      flex-shrink: 0;
      z-index: 3;
    }
    .arrow:hover { color: var(--ink-mute); }
    .arrow:active { color: var(--ink-mute); transform: scale(0.92); }
    .arrow:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
    .arrow svg {
      width: 28px;
      height: 28px;
      stroke-width: 1;
    }
    .arrow[disabled] { opacity: 0.3; cursor: not-allowed; }

    /* Viewport masks overflow; track slides horizontally */
    .viewport {
      position: relative;
      overflow: hidden;
      min-width: 0; /* allow grid cell to shrink */
    }
    .track {
      display: flex;
      will-change: transform;
      transition: transform var(--dur) var(--ease);
    }

    /* Each item = figure; one item spans the full viewport width */
    .work {
      flex: 0 0 100%;
      width: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .work-media {
      position: relative;
      background: var(--bg-warm);
      overflow: hidden;
      width: 100%;
      max-width: min(720px, 100%);
      aspect-ratio: 4 / 3;
    }
    @media (min-width: 768px) {
      .work-media { max-width: min(820px, 100%); }
    }
    .work-media img,
    .work-media video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--bg-warm);
      transition: opacity 420ms var(--ease);
    }
    /* .work-media img[data-loading="true"] { opacity: 0; } */

    /* Video thumbnail overlay */
    .play-badge {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.08);
      transition: background 200ms var(--ease);
    }
    .play-badge:hover { background: rgba(0,0,0,0.18); }
    .play-badge svg {
      width: 56px; height: 56px;
      fill: white;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.35));
    }
    .play-badge.hidden { display: none; }

    .work-caption {
      padding-top: 14px;
      font-size: 12px;
      line-height: 1.55;
      text-align: center;
      width: 100%;
      max-width: min(820px, 100%);
    }
    .work-caption .piece {
      font-family: var(--f-display);
      font-style: normal;
      font-optical-sizing: auto;
      font-size: 11px;
      color: var(--ink);
      line-height: 1.3;
      font-weight: 400;
    }
    .work-caption .meta {
      color: var(--ink-mute);
      font-size: 11px;
      letter-spacing: 0.02em;
      font-weight: 400;
    }

    /* =============================================================
       FOOTER
       ============================================================= */
    footer.site {
      position: relative;
      z-index: 2;
      padding: clamp(32px, 5vw, 64px) var(--page-pad);
      /* border-top: 1px solid var(--rule); */
      text-align: center;
    }
    footer.site .contact {
      font-family: var(--f-display);
      font-optical-sizing: auto;
      font-style: normal;
      font-size: clamp(18px, 2.5vw, 24px);
      color: var(--ink);
      border-bottom: 1px solid transparent;
      transition: border-color 200ms var(--ease);
    }
    footer.site .contact:hover { border-bottom-color: var(--ink); }
    footer.site .copyright {
      margin-top: 22px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }

    footer.site .short-rule {
      width: 60%;
      margin: 20px auto;
      border: none;
      border-top: 1px solid #ccc;
    }

    /* =============================================================
       LOADING / EMPTY STATES
       ============================================================= */
    .status {
      padding: 80px var(--page-pad);
      text-align: center;
      color: var(--ink-mute);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .skeleton .work-media {
      background: linear-gradient(100deg, var(--bg-warm) 30%, #ecebe4 50%, var(--bg-warm) 70%);
      background-size: 200% 100%;
      animation: shimmer 1.8s linear infinite;
    }
    @keyframes shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }

    /* =============================================================
       REDUCED MOTION
       ============================================================= */
    @media (prefers-reduced-motion: reduce) {
      .track { transition: none; }
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* =============================================================
       LIGHTBOX (for video click-to-play + image enlarge — optional)
       ============================================================= */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 18, 0.92);
      display: none;
      place-items: center;
      z-index: 1000;
      padding: 5vmin;
      overflow: hidden;
      overscroll-behavior: contain;
      touch-action: none;
    }
    .lightbox [hidden] { display: none !important; }
    .lightbox.open { display: grid; }
    .lightbox-content {
      max-width: 90vw;
      max-height: 90vh;
    }
    .lightbox-content img,
    .lightbox-content video {
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
    }
    /* 16:9 responsive iframe wrapper for Vimeo/YouTube embeds */
    .lightbox-content .embed-wrap {
      width: min(90vw, calc((90vh) * 16 / 9));
      aspect-ratio: 16 / 9;
      max-height: 90vh;
    }
    .lightbox-content .embed-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .lightbox-close {
      position: absolute;
      top: 20px; right: 24px;
      color: white;
      font-size: 28px;
      font-family: var(--f-display);
      font-optical-sizing: auto;
      width: 44px; height: 44px;
      display: grid; place-items: center;
      z-index: 2;
    }
    .lightbox-content img {
      user-select: none;
      -webkit-user-drag: none;
    }

    .lightbox .arrow {
      position: absolute;
      top: 50%;
      margin-top: -24px;
      color: #fff;
    }
    .lightbox .arrow:hover,
    .lightbox .arrow:active { color: rgba(255, 255, 255, 0.6); }
    .lightbox .arrow:focus-visible { outline-color: #fff; }
    .lightbox .lb-prev { left: clamp(4px, 2vw, 24px); }
    .lightbox .lb-next { right: clamp(4px, 2vw, 24px); }

    .lb-counter {
      position: absolute;
      top: 20px; left: 24px;
      height: 44px;
      display: flex; align-items: center;
      font-size: 11px;
      letter-spacing: 0.14em;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, 0.6);
      z-index: 2;
    }

    /* SKIP LINK for a11y */
    .skip {
      position: absolute;
      left: -9999px;
      top: 0;
    }
    .skip:focus {
      left: 12px; top: 12px;
      background: var(--ink); color: var(--bg);
      padding: 8px 12px; z-index: 1001;
    }
  </style>
</head>
<body>
  <a href="#work" class="skip">Skip to work</a>

  <header class="site">
    <h1 class="artist-name">Philippa Smith</h1>
  </header>

  <main id="work">
    <div id="projects-root">
      <div class="status" id="loading-msg">Loading works…</div>
    </div>
  </main>

  <footer class="site">
    <a class="contact" id="contact-link" href="mailto:hello@philippasmith.com">hello@philippasmith.com</a>
    <hr class="short-rule">
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged view">
    <span class="lb-counter" id="lb-counter" aria-live="polite"></span>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
    <button class="arrow lb-prev" id="lb-prev" aria-label="Previous work">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 4 8 12 16 20"/></svg>
    </button>
    <div class="lightbox-content" id="lightbox-content"></div>
    <button class="arrow lb-next" id="lb-next" aria-label="Next work">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 4 16 12 8 20"/></svg>
    </button>
  </div>

  <!-- =========================================================
       APP
       ========================================================= -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@sanity/client@6.22.1';
    import imageUrlBuilder from 'https://esm.sh/@sanity/image-url@1.0.2';

    /* ---------- CONFIG — EDIT THESE ---------- */
    const SANITY_PROJECT_ID = 'tdp5nb3h';
    const SANITY_DATASET    = 'production';
    const CONTACT_EMAIL     = 'philippasmith@icloud.com';
    /* ----------------------------------------- */

    // Update contact link if you change CONTACT_EMAIL above
    const contactEl = document.getElementById('contact-link');
    contactEl.href = `mailto:${CONTACT_EMAIL}`;
    contactEl.textContent = CONTACT_EMAIL;

    const client = createClient({
      projectId: SANITY_PROJECT_ID,
      dataset: SANITY_DATASET,
      apiVersion: '2024-01-01',
      useCdn: false, // hit the live API, not the CDN edge cache — content-first
    });
    const builder = imageUrlBuilder(client);
    const urlFor = (src) => builder.image(src);

    // GROQ query: fetch visible projects in order, with their works in order
    const QUERY = `
      *[_type == "project" && visible == true] | order(order asc) {
        _id,
        title,
        "works": works[]->{
          _id,
          pieceName,
          technique,
          size,
          year,
          mediaType,
          "image": image,
          "video": videoFile.asset->url,
          "videoUrl": videoUrl,
          "posterImage": posterImage
        }
      }
    `;

    async function loadProjects() {
      try {
        const projects = await client.fetch(QUERY);
        renderProjects(projects);
        injectStructuredData(projects);
      } catch (err) {
        console.error('Failed to load from Sanity:', err);
        document.getElementById('projects-root').innerHTML =
          `<div class="status">Unable to load works at this time.</div>`;
      }
    }

    function renderProjects(projects) {
      const root = document.getElementById('projects-root');
      if (!projects || !projects.length) {
        root.innerHTML = `<div class="status">No works to display yet.</div>`;
        return;
      }
      root.innerHTML = '';
      projects.forEach((p) => root.appendChild(buildProject(p)));
    }

    function buildProject(project) {
      const section = document.createElement('section');
      section.className = 'project';
      section.setAttribute('aria-label', `Project: ${project.title}`);

      const works = (project.works || []).filter(Boolean);
      const totalWorks = works.length;

      section.innerHTML = `
        <div class="project-head">
          <h2 class="project-title">${escapeHTML(project.title)}</h2>
          <span class="counter" aria-live="polite">${totalWorks ? '01' : '—'} / ${pad(totalWorks)}</span>
        </div>
        <div class="stage">
          <button class="arrow prev" aria-label="Previous work">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 4 8 12 16 20"/></svg>
          </button>
          <div class="viewport">
            <div class="track"></div>
          </div>
          <button class="arrow next" aria-label="Next work">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 4 16 12 8 20"/></svg>
          </button>
        </div>
      `;

      const track = section.querySelector('.track');
      works.forEach((w, i) => track.appendChild(buildWork(w, () => openLightbox(works, i, goTo))));

      // Attach carousel behaviour
      const goTo = attachCarousel(section, totalWorks);
      return section;
    }

    function isVideoWork(w) {
      return w.mediaType === 'video' && Boolean(w.video || w.videoUrl);
    }

    function buildWork(w, onOpen) {
      const fig = document.createElement('figure');
      fig.className = 'work';

      const media = document.createElement('div');
      media.className = 'work-media';

      if (isVideoWork(w)) {
        // Show poster image + play badge. Click opens lightbox with <video>
        const img = document.createElement('img');
        if (w.posterImage) {
          img.src = urlFor(w.posterImage).width(900).auto('format').quality(75).url();
          img.srcset = [
            urlFor(w.posterImage).width(600).auto('format').quality(70).url() + ' 600w',
            urlFor(w.posterImage).width(900).auto('format').quality(75).url() + ' 900w',
            urlFor(w.posterImage).width(1400).auto('format').quality(80).url() + ' 1400w',
          ].join(', ');
          img.sizes = '(max-width: 768px) calc(100vw - 150px), min(820px, calc(100vw - 250px))';
        }
        img.alt = w.pieceName || 'Video still';
        img.loading = 'lazy';
        img.decoding = 'async';
        media.appendChild(img);

        const badge = document.createElement('button');
        badge.className = 'play-badge';
        badge.setAttribute('aria-label', `Play ${w.pieceName || 'video'}`);
        badge.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
        badge.addEventListener('click', onOpen);
        media.appendChild(badge);
      } else if (w.image) {
        const img = document.createElement('img');
        img.src = urlFor(w.image).width(1200).auto('format').quality(78).url();
        img.srcset = [
          urlFor(w.image).width(600).auto('format').quality(72).url() + ' 600w',
          urlFor(w.image).width(900).auto('format').quality(75).url() + ' 900w',
          urlFor(w.image).width(1200).auto('format').quality(78).url() + ' 1200w',
          urlFor(w.image).width(1600).auto('format').quality(80).url() + ' 1600w',
          urlFor(w.image).width(2000).auto('format').quality(82).url() + ' 2000w',
        ].join(', ');
        img.sizes = '(max-width: 768px) calc(100vw - 150px), min(820px, calc(100vw - 250px))';
        img.alt = w.pieceName || 'Artwork';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.dataset.loading = 'true';
        img.addEventListener('load', () => { img.dataset.loading = 'false'; });
        img.addEventListener('click', onOpen);
        img.style.cursor = 'zoom-in';
        media.appendChild(img);
      }

      fig.appendChild(media);

      // Caption: 4 optional fields
      const cap = document.createElement('figcaption');
      cap.className = 'work-caption';
      const parts = [];
      if (w.pieceName) parts.push(`<span class="piece">${escapeHTML(w.pieceName)}</span>`);
      const metaBits = [w.technique, w.size, w.year].filter(Boolean).map(escapeHTML);
      if (metaBits.length) parts.push(`<span class="meta">${metaBits.join(' · ')}</span>`);
      cap.innerHTML = parts.join(' · ');
      if (parts.length) fig.appendChild(cap);

      return fig;
    }

    /* ---------- Carousel Logic ---------- */
    function attachCarousel(section, total) {
      const track = section.querySelector('.track');
      const prev = section.querySelector('.arrow.prev');
      const next = section.querySelector('.arrow.next');
      const counter = section.querySelector('.counter');

      // No works at all — disable and bail
      if (!total) { prev.disabled = true; next.disabled = true; return () => {}; }

      // Only one work — hide navigation UI entirely
      if (total < 2) {
        section.querySelector('.stage').classList.add('solo');
        return () => {};
      }

      // Seamless loop: [clone of last, ...works, clone of first]. After sliding
      // onto a clone we jump (without transition) to the real slide it mirrors.
      const firstClone = track.children[0].cloneNode(true);
      const lastClone = track.children[total - 1].cloneNode(true);
      for (const clone of [firstClone, lastClone]) {
        clone.setAttribute('aria-hidden', 'true');
        clone.inert = true;
      }
      track.appendChild(firstClone);
      track.insertBefore(lastClone, track.children[0]);

      let pos = 1;

      function itemStep() {
        // Distance to shift per step = first child width + gap (if any)
        const first = track.children[0];
        if (!first) return 0;
        const styles = getComputedStyle(track);
        const rawGap = parseFloat(styles.columnGap) || parseFloat(styles.gap) || 0;
        const gap = Number.isFinite(rawGap) ? rawGap : 0;
        return first.getBoundingClientRect().width + gap;
      }

      function setPosition(animate) {
        track.style.transition = animate ? '' : 'none';
        track.style.transform = `translate3d(${-pos * itemStep()}px, 0, 0)`;
        counter.textContent = `${pad(((pos - 1 + total) % total) + 1)} / ${pad(total)}`;
      }

      function settle() {
        if (pos === 0) pos = total;
        else if (pos === total + 1) pos = 1;
        else return;
        setPosition(false);
        // Force a reflow so the jump commits before the transition is restored
        void track.offsetWidth;
      }

      function hasTransition() {
        const cs = getComputedStyle(track);
        return cs.transitionProperty !== 'none' && parseFloat(cs.transitionDuration) > 0;
      }

      function move(delta) {
        const target = pos + delta;
        if (target < 0 || target > total + 1) {
          // Clicked again while heading onto a clone: shift the strip by one
          // full loop from wherever it is mid-animation, so the motion continues
          // seamlessly from the matching real slide.
          const shift = target < 0 ? total : -total;
          const current = new DOMMatrixReadOnly(getComputedStyle(track).transform).m41;
          track.style.transition = 'none';
          track.style.transform = `translate3d(${current - shift * itemStep()}px, 0, 0)`;
          void track.offsetWidth;
          pos += shift;
        }
        pos += delta;
        setPosition(true);
        if (!hasTransition()) settle();
      }

      function update() {
        settle();
        setPosition(false);
      }

      track.addEventListener('transitionend', (e) => { if (e.target === track) settle(); });

      next.addEventListener('click', () => move(1));
      prev.addEventListener('click', () => move(-1));

      // Keyboard support when focus is inside the section
      section.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { next.click(); e.preventDefault(); }
        if (e.key === 'ArrowLeft')  { prev.click(); e.preventDefault(); }
      });

      // Swipe support (mobile) — still user-initiated, respects your rule
      let startX = null;
      track.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
      track.addEventListener('touchend', (e) => {
        if (startX == null) return;
        const dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 50) (dx < 0 ? next : prev).click();
        startX = null;
      });

      // Recompute position on resize
      const ro = new ResizeObserver(update);
      ro.observe(track);
      window.addEventListener('resize', update);

      update();

      return (index) => { pos = index + 1; update(); };
    }

    /* ---------- Lightbox ---------- */
    const lb = document.getElementById('lightbox');
    const lbContent = document.getElementById('lightbox-content');
    const lbClose = document.getElementById('lightbox-close');
    const lbPrev = document.getElementById('lb-prev');
    const lbNext = document.getElementById('lb-next');
    const lbCounter = document.getElementById('lb-counter');

    let lbItems = [];
    let lbIndex = 0;
    let lbOnChange = null;
    let lbReturnFocus = null;
    let lbImg = null;

    function isLightboxOpen() { return lb.classList.contains('open'); }

    function openLightbox(items, index, onChange) {
      lbItems = items;
      lbOnChange = onChange;
      const multi = items.length > 1;
      lbPrev.hidden = !multi;
      lbNext.hidden = !multi;
      lbCounter.hidden = !multi;
      showLightboxItem(index);
      if (!isLightboxOpen()) {
        lbReturnFocus = document.activeElement;
        lb.classList.add('open');
        lockScroll();
      }
      lbClose.focus({ preventScroll: true });
    }

    function closeLightbox() {
      if (!isLightboxOpen()) return;
      lb.classList.remove('open');
      lbContent.innerHTML = '';
      lbImg = null;
      unlockScroll();
      lbReturnFocus?.focus?.({ preventScroll: true });
      lbReturnFocus = null;
    }

    function showLightboxItem(i) {
      lbIndex = (i + lbItems.length) % lbItems.length;
      const w = lbItems[lbIndex];
      lbContent.innerHTML = '';
      lbImg = null;
      if (isVideoWork(w)) renderLightboxVideo(w);
      else if (w.image) renderLightboxImage(w);
      lbCounter.textContent = `${pad(lbIndex + 1)} / ${pad(lbItems.length)}`;
      lbOnChange?.(lbIndex);
    }

    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', () => showLightboxItem(lbIndex - 1));
    lbNext.addEventListener('click', () => showLightboxItem(lbIndex + 1));
    lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (!isLightboxOpen()) return;
      const multi = lbItems.length > 1;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowRight' && multi) showLightboxItem(lbIndex + 1);
      else if (e.key === 'ArrowLeft' && multi) showLightboxItem(lbIndex - 1);
      else return;
      e.preventDefault();
    });

    /* ---------- Scroll lock ----------
       overflow:hidden on <body> is ignored by iOS Safari, so pin the body with
       position:fixed and restore the scroll offset on unlock. */
    let lockedScrollY = 0;
    function lockScroll() {
      lockedScrollY = window.scrollY;
      const scrollbar = window.innerWidth - document.documentElement.clientWidth;
      Object.assign(document.body.style, {
        position: 'fixed',
        top: `-${lockedScrollY}px`,
        left: '0',
        right: '0',
        paddingRight: scrollbar > 0 ? `${scrollbar}px` : '',
      });
    }
    function unlockScroll() {
      Object.assign(document.body.style, { position: '', top: '', left: '', right: '', paddingRight: '' });
      window.scrollTo({ top: lockedScrollY, behavior: 'instant' });
    }

    /* ---------- Swipe to navigate ---------- */
    let swipeStart = null;
    lbContent.addEventListener('pointerdown', (e) => {
      if (!lbImg || e.target !== lbImg) return;
      e.preventDefault();
      lbImg.setPointerCapture(e.pointerId);
      swipeStart = { x: e.clientX, y: e.clientY };
    });
    lbContent.addEventListener('pointerup', (e) => {
      if (!swipeStart) return;
      const dx = e.clientX - swipeStart.x;
      const dy = e.clientY - swipeStart.y;
      swipeStart = null;
      if (lbItems.length > 1 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        showLightboxItem(lbIndex + (dx < 0 ? 1 : -1));
      }
    });
    lbContent.addEventListener('pointercancel', () => { swipeStart = null; });

    function renderLightboxImage(w) {
      const img = document.createElement('img');
      img.src = urlFor(w.image).width(1800).auto('format').quality(85).url();
      img.alt = w.pieceName || 'Artwork';
      img.draggable = false;
      lbContent.appendChild(img);
      lbImg = img;
    }
    function renderLightboxVideo(w) {
      const externalUrl = w.videoUrl;
      const vimeoId = externalUrl && parseVimeoId(externalUrl);
      const youtubeId = externalUrl && parseYouTubeId(externalUrl);

      if (vimeoId) {
        // Vimeo embed
        const wrap = document.createElement('div');
        wrap.className = 'embed-wrap';
        const iframe = document.createElement('iframe');
        iframe.src = `https://player.vimeo.com/video/${vimeoId}?autoplay=1&title=0&byline=0&portrait=0&dnt=1`;
        iframe.title = w.pieceName || 'Video';
        iframe.allow = 'autoplay; fullscreen; picture-in-picture';
        iframe.setAttribute('allowfullscreen', '');
        iframe.frameBorder = '0';
        wrap.appendChild(iframe);
        lbContent.appendChild(wrap);
      } else if (youtubeId) {
        // YouTube embed
        const wrap = document.createElement('div');
        wrap.className = 'embed-wrap';
        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube-nocookie.com/embed/${youtubeId}?autoplay=1&rel=0&modestbranding=1`;
        iframe.title = w.pieceName || 'Video';
        iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
        iframe.setAttribute('allowfullscreen', '');
        iframe.frameBorder = '0';
        wrap.appendChild(iframe);
        lbContent.appendChild(wrap);
      } else {
        // Direct video file (Sanity upload or direct .mp4 URL)
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.src = w.video || w.videoUrl;
        lbContent.appendChild(video);
      }
    }

    /* ---------- Video URL parsers ---------- */
    // Handles: vimeo.com/123456789, vimeo.com/123456789/abcdef (private hash),
    //          player.vimeo.com/video/123456789, vimeo.com/channels/xxx/123456789,
    //          vimeo.com/groups/xxx/videos/123456789
    function parseVimeoId(url) {
      if (!url) return null;
      try {
        const u = new URL(url);
        if (!/(^|\.)vimeo\.com$/.test(u.hostname)) return null;
        const parts = u.pathname.split('/').filter(Boolean);
        for (const p of parts) {
          if (/^\d+$/.test(p)) return p;
        }
        return null;
      } catch { return null; }
    }
    // Handles: youtube.com/watch?v=XXX, youtu.be/XXX, youtube.com/embed/XXX, youtube.com/shorts/XXX
    function parseYouTubeId(url) {
      if (!url) return null;
      try {
        const u = new URL(url);
        if (u.hostname === 'youtu.be') return u.pathname.slice(1) || null;
        if (!/(^|\.)youtube\.com$/.test(u.hostname) && !/(^|\.)youtube-nocookie\.com$/.test(u.hostname)) return null;
        if (u.searchParams.get('v')) return u.searchParams.get('v');
        const m = u.pathname.match(/^\/(embed|shorts|v)\/([^/?#]+)/);
        return m ? m[2] : null;
      } catch { return null; }
    }

    /* ---------- Helpers ---------- */
    function escapeHTML(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) =>
        ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])
      );
    }
    function pad(n) { return String(n).padStart(2, '0'); }

    /* ---------- JSON-LD enrichment (AI SEO) ---------- */
    function injectStructuredData(projects) {
      const works = [];
      projects.forEach((p) => {
        (p.works || []).filter(Boolean).forEach((w) => {
          if (!w.pieceName) return;
          works.push({
            '@type': 'VisualArtwork',
            name: w.pieceName,
            artMedium: w.technique || undefined,
            artform: 'Visual art',
            dateCreated: w.year || undefined,
            artworkSurface: w.size || undefined,
            creator: { '@type': 'Person', name: 'Philippa Smith' },
            isPartOf: p.title,
          });
        });
      });
      if (!works.length) return;
      const node = document.getElementById('portfolio-ld');
      const data = JSON.parse(node.textContent);
      data.hasPart = works;
      node.textContent = JSON.stringify(data);
    }

    /* ---------- PWA ---------- */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    loadProjects();
  </script>
</body>
</html>
