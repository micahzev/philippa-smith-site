<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not found — Philippa Smith</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=DM+Mono:wght@300&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #fafaf7; color: #1a1a1a; }
    body {
      display: grid; place-items: center; text-align: center;
      font-family: 'DM Mono', monospace;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: clamp(48px, 10vw, 120px);
      margin: 0 0 12px;
    }
    p { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #8a8880; margin: 8px 0 28px; }
    a {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      color: #1a1a1a; font-size: 18px; border-bottom: 1px solid #1a1a1a; text-decoration: none;
      padding-bottom: 2px;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>— Page not found —</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
